<!DOCTYPE html>
<html lang="fa" dir="rtl">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width,initial-scale=1">

        <title>پروفایل</title>

        <link rel="stylesheet" href="prophile.css">

    </head>

    <body>

        <div class="overlay">

            <div class="profile-card">

                <div class="avatar">

                    <img src="../images/images.png" id="avatar">

                </div>

                <h2 id="profileName">...</h2>

                <p id="profilePhone">...</p>

                <div class="invite-box">

                    <p>کد اختصاصی شما</p>

                    <h3 id="profileCode">...</h3>

                </div>

                <div class="wallet">

                    <h4>موجودی کیف پول</h4>

                    <h1 id="profileWallet">0 USDT</h1>

                    <p id="dailyProfit">
                        سود روزانه :
                        ۲.۵٪
                    </p>

                </div>

                <button id="chargeBtn">

                    افزایش موجودی

                </button>

                <div class="stats">

                    <div>

                        <h4 id="teamCount">0</h4>

                        <span>اعضای تیم</span>

                    </div>

                    <div>

                        <h4 id="income">0</h4>

                        <span>کل درآمد</span>

                    </div>

                    <div>

                        <h4 id="joinDate">---</h4>

                        <span>تاریخ عضویت</span>

                    </div>

                </div>

                <div class="menu">

                    <button id="accountBtn">

                        اطلاعات حساب

                    </button>

                    <button id="inviteBtn">

                        کد دعوت

                    </button>

                    <button id="historyBtn">

                        سوابق

                    </button>

                    <button id="logoutBtn">

                        خروج

                    </button>

                </div>

                <button
                    id="adminBtn">

                    ورود به پنل مدیریت

                </button>

            </div>

        </div>

        <script src="prophile.js"></script>

    </body>

</html>
